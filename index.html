<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <link rel="stylesheet" href="codemirror-5.65.21/lib/codemirror.css">
    <script src="codemirror-5.65.21/lib/codemirror.js"></script>

    <script src="codemirror-5.65.21/mode/clike/clike.js"></script>
    <script src="codemirror-5.65.21/mode/python/python.js"></script>

    <link rel="stylesheet" href="codemirror-5.65.21/theme/dracula.css">

    <script src="codemirror-5.65.21/addon/edit/closebrackets.js"></script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

</head>

<body>
    <div class="row m-3">
        <div class="col ">
            <div class ="d-flex justify-content-between mb-2 bg-dark rounded p-2">
                <div class="col-12 w-25">
                    <label class="visually-hidden" for="inlineFormSelectPref">Preference</label>
                    <select class="form-select" id="inlineFormSelectPref">
                        <option selected>Choose...</option>
                        <option value="Java">Java</option>
                        <option value="Cpp">Cpp</option>
                        <option value="Python">Python</option>
                    </select>
                </div>

                <div>
                    <!-- <button type="button" class="btn btn-success">Success</button> -->
                    <button type="button" id="run" class="btn btn-success"><i class="bi bi-play-fill"></i></button>
                    
                </div>
            </div>
            
            <textarea type="text" id="editor" class="form-control" aria-label="First name"></textarea>

        </div>



        <div class="col d-flex flex-column rounded bg-dark px-4">
            <div class="h-50">
                <label for="Input" class="text-light mt-4 mb-2">Input</label>
                <textarea type="text" class="form-control h-75" aria-label="Last name" id="input"></textarea>
            </div>
            <div class="h-50">
                <label for="Output" class="text-light mb-2">Output</label>
                <textarea type="text" class="form-control h-75" aria-label="Last name" id="output"></textarea>
            </div>
        </div>
    </div>

</body>


<script>
    let editor = CodeMirror.fromTextArea(document.getElementById("editor"), {
        mode: "text/x-c++src",
        theme: "dracula",
        lineNumbers: true,
        autoCloseBrackets: true,

    })
    let width = window.innerWidth
    let input =document.getElementById("input")
    let output =document.getElementById("output")
    let run =document.getElementById("run")
    
    editor.setSize(0.7 * width, "650")
    let option =document.getElementById("inlineFormSelectPref")
    option.addEventListener("change",function(){
        if(option.value === "Java"){
            editor.setOption("mode", "text/x-java")
        }
        else if(option.value === "Python"){
            editor.setOption("mode", "text/x-python")
            
        }
        else{
            editor.setOption("mode", "text/x-c++src")

        }
    })

    let code;
    run .addEventListener("click", async function(){
        code={
            code:editor.getValue(),
            input:input.value,
            lang:option.value
        }
        let oData = await fetch("http://localhost:3000/compile", {
            method:"POST",
            headers: {
                "Content-Type":"application/json"
            },
            body:JSON.stringify(code)
        })

        let d= await oData.json()
        output.value =d.output
    })
</script>

</html>
